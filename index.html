<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>정방형 이미지 합치기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#18202c;font:15px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px 16px 40px}h1{font-size:24px;margin:0 0 6px}p{color:#626b78;margin:0 0 18px}section{background:white;border-radius:16px;padding:16px;margin:12px 0}button,.pick,select{font:inherit;border:1px solid #d7dbe2;border-radius:10px;padding:12px;background:white;color:inherit}button,.pick{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}.primary,.pick{background:#202938;color:white;border:0;text-align:center;font-weight:600}.pick{display:block;position:relative;overflow:hidden}input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar>*{flex:1}label.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}input[type=range]{width:48%}canvas{display:block;width:100%;height:auto;background:#e6e8ec;border-radius:8px;aspect-ratio:1}#thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.thumb{position:relative;min-width:0}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}.controls{display:flex;gap:3px;margin-top:4px}.controls button{padding:6px 2px;flex:1;font-size:13px}.status{font-size:13px;color:#626b78;margin:10px 0 0;overflow-wrap:anywhere}#preview{touch-action:none}button:focus-visible{outline:2px solid #587ccc}small{color:#626b78}</style></head><body><main><h1>정방형 이미지 합치기</h1><p>사진 2~9장을 한 장의 1:1 이미지로 합칩니다.</p><section><label class="pick">사진 선택 / 추가<input id="files" type="file" accept="image/*" multiple></label><div class="status" id="count">0 / 9장</div><div id="thumbs"></div><button id="clear" style="margin-top:12px;width:100%" disabled>전체 삭제</button></section><section><label class="setting">배치<select id="layout"><option value="auto">자동</option><option value="alternate">다른 배치</option></select></label><label class="setting">사진 맞춤<select id="fit"><option value="cover">채우기 (중앙 자르기)</option><option value="contain">전체 표시</option></select></label><label class="setting">간격 <span id="gapval">0 px</span><input id="gap" type="range" min="0" max="40" value="0"></label><label class="setting">배경색<input id="bg" type="color" value="#ffffff"></label><label class="setting">출력 크기<select id="size"><option value="1080">1080 × 1080</option><option value="2048" selected>2048 × 2048</option><option value="3072">3072 × 3072</option></select></label></section><section><canvas id="preview" width="600" height="600"></canvas><p class="status">채우기 모드에서는 미리보기의 사진을 드래그해 잘리는 위치를 조절할 수 있습니다.</p><div class="bar" style="margin-top:12px"><button class="primary" id="save" disabled>JPG 저장</button><button id="png" disabled>PNG 저장</button><button id="share" disabled>공유</button></div><div id="status" class="status" role="status" aria-live="polite"></div></section><small>모든 사진은 기기에서만 처리되며 서버로 전송되지 않습니다. iPhone에서는 파일 앱의 미리보기 대신 Safari에서 웹 주소로 열어 주세요.</small></main><script>
const $=id=>document.getElementById(id), photos=[]; let cells=[],drag=null,busy=false; const canvas=$('preview');
// Each row fills the width; row heights are equal, except the special 3-photo layout.
function geometry(n,alt){if(n===2)return alt?[[0,0,1,.5],[0,.5,1,.5]]:[[0,0,.5,1],[.5,0,.5,1]];if(n===3)return alt?[[0,0,1,.5],[0,.5,.5,.5],[.5,.5,.5,.5]]:[[0,0,.5,1],[.5,0,.5,.5],[.5,.5,.5,.5]];let rows=({4:[2,2],5:[2,3],6:[3,3],7:[3,2,2],8:[3,3,2],9:[3,3,3]})[n];if(!rows)return [];if(alt)rows=n===6?[2,2,2]:[...rows].reverse();return rows.flatMap((k,y)=>Array.from({length:k},(_,x)=>[x/k,y/rows.length,1/k,1/rows.length]));}
function draw(c,size){c.width=c.height=size;let ctx=c.getContext('2d');ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,size,size);let g=Number($('gap').value)*size/Number($('size').value);let layout=geometry(photos.length,$('layout').value==='alternate');let result=[];if(photos.length===1)layout=[[0,0,1,1]];layout.forEach(([x,y,w,h],i)=>{let p=photos[i];let X=x*size+g/2,Y=y*size+g/2,W=w*size-g,H=h*size-g;let cover=$('fit').value==='cover',s=(cover?Math.max:Math.min)(W/p.img.naturalWidth,H/p.img.naturalHeight),dw=p.img.naturalWidth*s,dh=p.img.naturalHeight*s;let dx=X+(W-dw)*(cover?p.x:.5),dy=Y+(H-dh)*(cover?p.y:.5);ctx.save();ctx.beginPath();ctx.rect(X,Y,W,H);ctx.clip();ctx.drawImage(p.img,dx,dy,dw,dh);ctx.restore();result.push({X,Y,W,H,dw,dh,p});});if(!photos.length){ctx.fillStyle='#e6e8ec';ctx.fillRect(0,0,size,size);ctx.fillStyle='#626b78';ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillText('사진을 선택하세요',size/2,size/2);}return result;}
function refresh(){cells=draw(canvas,900);$('count').textContent=`${photos.length} / 9장`;$('gapval').textContent=$('gap').value+' px';for(const id of ['save','png','share'])$(id).disabled=busy||photos.length<2;$('clear').disabled=busy||!photos.length;}
function rebuild(){const root=$('thumbs');root.textContent="";photos.forEach((p,i)=>{let box=document.createElement('div');box.className='thumb';let im=document.createElement('img');im.src=p.url;im.alt=`사진 ${i+1}`;box.append(im);let controls=document.createElement('div');controls.className='controls';for(const [label,action,disabled] of [['◀',()=>move(i,-1),i===0],['▶',()=>move(i,1),i===photos.length-1],['삭제',()=>{URL.revokeObjectURL(p.url);photos.splice(i,1);rebuild();},false]]){let b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=action;controls.append(b);}box.append(controls);root.append(box);});refresh();}
function move(i,d){[photos[i],photos[i+d]]=[photos[i+d],photos[i]];rebuild();}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('이미지 형식을 읽을 수 없습니다'));im.src=src;});}
function readData(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('파일 읽기 실패'));r.readAsDataURL(f);});}
async function prepare(f){let url=URL.createObjectURL(f);try{let im;try{im=await loadImage(url);}catch(e){im=await loadImage(await readData(f));}const max=3072,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));if(scale<1){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.96));if(blob){const next=URL.createObjectURL(blob);try{im=await loadImage(next);URL.revokeObjectURL(url);url=next;}catch(e){URL.revokeObjectURL(next);throw e;}}c.width=c.height=1;}return {img:im,url,x:.5,y:.5};}catch(e){URL.revokeObjectURL(url);throw e;}}
$('files').addEventListener('change',async function(){if(busy)return;const list=Array.from(this.files||[]);this.value='';if(!list.length)return;busy=true;this.disabled=true;refresh();let failed=0,extra=Math.max(0,list.length-(9-photos.length));const batch=list.slice(0,9-photos.length);try{for(let i=0;i<batch.length;i++){$('status').textContent=`사진 읽는 중 ${i+1}/${batch.length}…`;try{photos.push(await prepare(batch[i]));rebuild();}catch(e){failed++;}}}finally{busy=false;this.disabled=false;rebuild();$('status').textContent=[failed?`${failed}장 읽기 실패. HEIC인 경우 JPEG로 변환한 뒤 다시 선택해 주세요.`:'',extra?'최대 9장까지만 추가했습니다.':'',!failed&&!extra?'사진을 불러왔습니다.':''].filter(Boolean).join(' ');}});
$('clear').onclick=()=>{photos.forEach(p=>URL.revokeObjectURL(p.url));photos.length=0;rebuild();};for(const id of ['layout','fit','gap','bg','size'])$(id).oninput=refresh;
function point(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];}canvas.onpointerdown=e=>{if($('fit').value!=='cover')return;let [x,y]=point(e),c=cells.find(c=>x>=c.X&&x<=c.X+c.W&&y>=c.Y&&y<=c.Y+c.H);if(c){drag={c,x,y,px:c.p.x,py:c.p.y};canvas.setPointerCapture(e.pointerId);}};canvas.onpointermove=e=>{if(!drag)return;let [x,y]=point(e),{c}=drag,clamp=v=>Math.max(0,Math.min(1,v));if(c.dw>c.W+.01)c.p.x=clamp(drag.px-(x-drag.x)/(c.dw-c.W));if(c.dh>c.H+.01)c.p.y=clamp(drag.py-(y-drag.y)/(c.dh-c.H));refresh();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
async function exportImage(type,share=false){if(photos.length<2||busy)return;busy=true;refresh();try{let out=document.createElement('canvas');draw(out,Number($('size').value));let blob=await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(Error('이미지 생성 실패')),type,.95));let name='square_collage_'+Date.now()+'.'+(type==='image/png'?'png':'jpg');let file=new File([blob],name,{type});if(share&&typeof navigator.canShare==='function'&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});}else{let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent=share?'공유를 지원하지 않아 파일 다운로드로 전환했습니다.':'이미지 다운로드를 요청했습니다.';}}catch(e){$('status').textContent=e.name==='AbortError'?'공유가 취소되었습니다.':`저장 실패: ${e.message}`;}finally{busy=false;refresh();}}$('save').onclick=()=>exportImage('image/jpeg');$('png').onclick=()=>exportImage('image/png');$('share').onclick=()=>exportImage('image/jpeg',true);refresh();</script></body></html>
